<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0F1E" />
  <title>Юридические документы — Diktum</title>
  <link rel="icon" href="assets/icon/app_icon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0A0F1E;
      --bg2: #0F172A;
      --surface: #1E293B;
      --border: #334155;
      --text: #F1F5F9;
      --text-muted: #94A3B8;
      --accent: #0EA5E9;
      --accent-glow: #38BDF8;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
    }
    a { color: var(--accent-glow); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 14px 24px;
      background: rgba(10, 15, 30, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(51, 65, 85, 0.3);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .top-bar img { width: 28px; height: 28px; border-radius: 6px; }
    .top-bar span { font-size: 15px; font-weight: 700; }
    .top-bar a.back {
      margin-left: auto;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      max-width: 800px;
      margin: 0 auto;
      padding: 0 24px;
    }
    .tab {
      padding: 14px 20px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
    }
    .tab:hover { color: var(--text); }
    .tab.active {
      color: var(--accent-glow);
      border-bottom-color: var(--accent-glow);
    }

    .doc-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }
    .doc-content { display: none; }
    .doc-content.active { display: block; }

    /* Markdown styling */
    .doc-content h1 { font-size: 28px; font-weight: 800; margin: 0 0 20px; }
    .doc-content h2 { font-size: 20px; font-weight: 700; margin: 32px 0 12px; color: var(--accent-glow); }
    .doc-content h3 { font-size: 16px; font-weight: 700; margin: 24px 0 8px; }
    .doc-content p { margin: 0 0 14px; color: var(--text-muted); font-size: 15px; }
    .doc-content ul, .doc-content ol { margin: 0 0 14px; padding-left: 24px; color: var(--text-muted); font-size: 15px; }
    .doc-content li { margin-bottom: 6px; }
    .doc-content strong { color: var(--text); }
    .doc-content hr { border: none; height: 1px; background: var(--border); margin: 28px 0; }

    .footer {
      padding: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      opacity: 0.5;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 480px) {
      .tabs { overflow-x: auto; }
      .tab { padding: 12px 14px; font-size: 13px; white-space: nowrap; }
    }
  </style>
    <!-- Yandex.Metrika counter -->
    <script type="text/javascript">
       (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
       m[i].l=1*new Date();
       for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
       k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})

</head>
<body>
  <div class="top-bar">
    <img src="assets/icon/app_icon.png" alt="" />
    <span>Diktum</span>
    <a href="index.html" class="back">&larr; На главную</a>
  </div>

  <div class="tabs">
    <button class="tab active" data-doc="privacy">Политика конфиденциальности</button>
    <button class="tab" data-doc="terms">Условия использования</button>
    <button class="tab" data-doc="referral-rules">Реферальная программа</button>
    <button class="tab" data-doc="child-safety">Безопасность детей</button>
  </div>

  <div class="doc-container">
    <div class="doc-content active" id="doc-privacy"></div>
    <div class="doc-content" id="doc-terms"></div>
    <div class="doc-content" id="doc-referral-rules"></div>
    <div class="doc-content" id="doc-child-safety"></div>
  </div>

  <div class="footer">&copy; 2026 Diktum. Все права защищены.</div>

  <script>
    const docs = {
      'privacy': 'assets/privacy_policy_ru.md',
      'terms': 'assets/terms_of_service_ru.md',
      'referral-rules': 'assets/referral_rules_ru.md',
      'child-safety': 'assets/child_safety_policy_ru.md',
    };
    const loaded = {};

    async function loadDoc(key) {
      if (loaded[key]) return;
      try {
        const res = await fetch(docs[key]);
        const md = await res.text();
        document.getElementById('doc-' + key).innerHTML = marked.parse(md);
        loaded[key] = true;
      } catch (e) {
        document.getElementById('doc-' + key).innerHTML = '<p>Не удалось загрузить документ.</p>';
      }
    }

    // Tabs
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.doc-content').forEach(d => d.classList.remove('active'));
        tab.classList.add('active');
        const key = tab.dataset.doc;
        document.getElementById('doc-' + key).classList.add('active');
        loadDoc(key);
        // Update URL hash
        history.replaceState(null, '', '#' + key);
      });
    });

    // Load from hash or default
    const hash = location.hash.replace('#', '');
    const initialDoc = ['privacy', 'terms', 'referral-rules', 'child-safety'].includes(hash) ? hash : 'privacy';
    if (initialDoc !== 'privacy') {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.doc-content').forEach(d => d.classList.remove('active'));
      document.querySelector(`[data-doc="${initialDoc}"]`).classList.add('active');
      document.getElementById('doc-' + initialDoc).classList.add('active');
    }
    loadDoc(initialDoc);
  </script>
</body>
</html>
